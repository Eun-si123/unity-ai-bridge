name: Phase 1 Local Bridge Verification

on:
  push:
    branches: [feat/phase1-local-heartbeat]
  pull_request:
    branches: [main, feat/phase0-runtime-scaffold]

permissions:
  contents: write

jobs:
  node-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Refresh lockfile
        run: npm install --package-lock-only --prefix mcp-server

      - name: Install dependencies
        run: npm ci --prefix mcp-server

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- mcp-server/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-server/package-lock.json
          git commit -m "chore: refresh mcp-server lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
