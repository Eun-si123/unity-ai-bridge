name: Phase 1 Local Bridge Verification

on:
  push:
    branches: [feat/phase1-local-heartbeat]
  pull_request:
    branches: [main, feat/phase0-runtime-scaffold]

permissions:
  contents: read

concurrency:
  group: phase1-local-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies from committed lockfile
        run: npm ci --prefix mcp-server --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test local bridge contract
        run: npm --prefix mcp-server run test:local-bridge:built
